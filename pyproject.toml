[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-x"
version = "0.1.0"
description = "🔬 Project X - Advanced Experimentation Framework"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Murad Ghannam", email = "eng.murad.ghannam@gmail.com"}
]
keywords = ["experiments", "research", "framework", "analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "structlog>=23.0.0",
    "prometheus-client>=0.17.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.3.0",
    "pytest-benchmark>=4.0.0",
    "pytest-mock>=3.11.0",
    "factory-boy>=3.3.0",
    "faker>=19.0.0",
    "coverage[toml]>=7.3.0",
    "freezegun>=1.2.0",
    "responses>=0.23.0",
]
experiment = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "sympy>=1.12.0",
    "networkx>=3.1.0",
    "statsmodels>=0.14.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
]
security = [
    "bandit[toml]>=1.7.5",
    "safety>=2.3.0",
    "cryptography>=41.0.0",
]
all = [
    "project-x[dev,test,experiment,security]"
]

[project.scripts]
project-x = "src.cli:main"
px = "src.cli:main"

[project.urls]
Homepage = "https://github.com/engmuradghannam-dot/project-x"
Documentation = "https://github.com/engmuradghannam-dot/project-x#readme"
Repository = "https://github.com/engmuradghannam-dot/project-x"
Issues = "https://github.com/engmuradghannam-dot/project-x/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ═══════════════════════════════════════════════════
# 🎨 BLACK - Code Formatting
# ═══════════════════════════════════════════════════
[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# ═══════════════════════════════════════════════════
# 📐 ISORT - Import Sorting
# ═══════════════════════════════════════════════════
[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["src"]

# ═══════════════════════════════════════════════════
# 🔬 FLAKE8 - Linting
# ═══════════════════════════════════════════════════
[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503", "E501"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".tox",
]

# ═══════════════════════════════════════════════════
# 📝 MYPY - Type Checking
# ═══════════════════════════════════════════════════
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

# ═══════════════════════════════════════════════════
# 🧪 PYTEST - Testing
# ═══════════════════════════════════════════════════
[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-ra",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
    "experiment: Experiment tests",
    "benchmark: Performance benchmarks",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ═══════════════════════════════════════════════════
# 📊 COVERAGE - Test Coverage
# ═══════════════════════════════════════════════════
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"

# ═══════════════════════════════════════════════════
# 🛡️ BANDIT - Security
# ═══════════════════════════════════════════════════
[tool.bandit]
exclude_dirs = ["tests", "docs", "scripts"]
skips = ["B101", "B601"]

# ═══════════════════════════════════════════════════
# 📝 PRE-COMMIT
# ═══════════════════════════════════════════════════
[tool.pre-commit]
repos = [
    { repo = "https://github.com/pre-commit/pre-commit-hooks", rev = "v4.4.0", hooks = [
        { id = "trailing-whitespace" },
        { id = "end-of-file-fixer" },
        { id = "check-yaml" },
        { id = "check-added-large-files" },
        { id = "check-merge-conflict" },
    ]},
    { repo = "https://github.com/psf/black", rev = "23.7.0", hooks = [
        { id = "black", language_version = "python3" },
    ]},
    { repo = "https://github.com/pycqa/isort", rev = "5.12.0", hooks = [
        { id = "isort", args = ["--profile", "black"] },
    ]},
    { repo = "https://github.com/pycqa/flake8", rev = "6.1.0", hooks = [
        { id = "flake8", args = ["--max-line-length=120"] },
    ]},
]
