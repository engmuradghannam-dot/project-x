name: 🔥 Project X - Full CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'feature/*', 'experiment/*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      run_experiments:
        description: 'Run experiments?'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ═══════════════════════════════════════════════════
  # 🔍 PRE-CHECK: Code Quality & Security
  # ═══════════════════════════════════════════════════
  pre-check:
    name: 🔍 Pre-Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: |
          pip install pre-commit black isort flake8 mypy bandit safety

      - name: 🎨 Black Format Check
        run: black --check --diff src/ tests/

      - name: 📐 isort Check
        run: isort --check-only --diff src/ tests/

      - name: 🔬 Flake8 Lint
        run: flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203,W503

      - name: 📝 MyPy Type Check
        run: mypy src/ --ignore-missing-imports

      - name: 🛡️ Bandit Security Scan
        run: bandit -r src/ -f json -o bandit-report.json || true

      - name: 🔒 Safety Vulnerability Check
        run: safety check --json --output safety-report.json || true

      - name: 📊 Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  # ═══════════════════════════════════════════════════
  # 🧪 UNIT TESTS
  # ═══════════════════════════════════════════════════
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: pre-check
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Install dependencies
        run: |
          pip install -e ".[dev,test]"

      - name: 🧪 Run Unit Tests with Coverage
        run: |
          pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=html --junitxml=unit-test-results.xml

      - name: 📊 Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: 📊 Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-py${{ matrix.python-version }}
          path: |
            unit-test-results.xml
            htmlcov/

  # ═══════════════════════════════════════════════════
  # 🔗 INTEGRATION TESTS
  # ═══════════════════════════════════════════════════
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: pre-check
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: project_x_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: |
          pip install -e ".[dev,test]"

      - name: 🔗 Run Integration Tests
        run: |
          pytest tests/integration/ -v --cov=src --cov-append --junitxml=integration-test-results.xml
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/project_x_test
          REDIS_URL: redis://localhost:6379/0

      - name: 📊 Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: integration-test-results.xml

  # ═══════════════════════════════════════════════════
  # 🎯 E2E TESTS
  # ═══════════════════════════════════════════════════
  e2e-tests:
    name: 🎯 E2E Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: |
          pip install -e ".[dev,test]"

      - name: 🎯 Run E2E Tests
        run: |
          pytest tests/e2e/ -v --junitxml=e2e-test-results.xml

      - name: 📊 Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e-test-results.xml

  # ═══════════════════════════════════════════════════
  # 🧪 EXPERIMENT RUNNER
  # ═══════════════════════════════════════════════════
  experiments:
    name: 🧪 Run Experiments
    runs-on: ubuntu-latest
    if: github.event.inputs.run_experiments == 'true' || contains(github.ref, 'experiment/')
    needs: [unit-tests, integration-tests]
    timeout-minutes: 120
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: |
          pip install -e ".[dev,experiment]"

      - name: 🧪 Run Experiments
        run: |
          python -m src.experiments.runner --all --output-dir=experiments-output/

      - name: 📊 Upload Experiment Results
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: experiments-output/

  # ═══════════════════════════════════════════════════
  # 🐳 DOCKER BUILD & PUSH
  # ═══════════════════════════════════════════════════
  docker-build:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🐳 Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ═══════════════════════════════════════════════════
  # 🚀 DEPLOY TO STAGING
  # ═══════════════════════════════════════════════════
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [e2e-tests, docker-build]
    if: github.ref == 'refs/heads/develop' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.project-x.dev
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Staging
        run: |
          echo "🚀 Deploying to STAGING..."
          # Add your staging deployment script here
          # e.g., SSH to server, pull image, restart container

  # ═══════════════════════════════════════════════════
  # 🚀 DEPLOY TO PRODUCTION
  # ═══════════════════════════════════════════════════
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [e2e-tests, docker-build]
    if: github.ref == 'refs/heads/main' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://project-x.dev
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Production
        run: |
          echo "🚀 Deploying to PRODUCTION..."
          # Add your production deployment script here

  # ═══════════════════════════════════════════════════
  # 📋 SUMMARY REPORT
  # ═══════════════════════════════════════════════════
  summary:
    name: 📋 Summary Report
    runs-on: ubuntu-latest
    needs: [pre-check, unit-tests, integration-tests, e2e-tests, docker-build]
    if: always()
    steps:
      - name: 📊 Generate Summary
        run: |
          echo "## 🔥 Project X - CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-Check | ${{ needs.pre-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
