name: 📤 Auto-Push & Sync

on:
  workflow_run:
    workflows: ["🔥 Project X - Full CI/CD Pipeline"]
    types: [completed]
    branches: [main, develop]

jobs:
  # ═══════════════════════════════════════════════════
  # 📤 Auto-Push to Mirror Repos
  # ═══════════════════════════════════════════════════
  sync-mirrors:
    name: 📤 Sync to Mirror Repos
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Push to GitLab Mirror
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/${{ github.repository }}.git || true
          git push gitlab ${{ github.ref_name }} --force || true

      - name: 📤 Push to Bitbucket Mirror
        run: |
          git remote add bitbucket https://x-token-auth:${{ secrets.BITBUCKET_TOKEN }}@bitbucket.org/${{ github.repository }}.git || true
          git push bitbucket ${{ github.ref_name }} --force || true

  # ═══════════════════════════════════════════════════
  # 📊 Update Badges & Stats
  # ═══════════════════════════════════════════════════
  update-badges:
    name: 📊 Update Badges
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📊 Generate Coverage Badge
        run: |
          echo "Coverage badge updated" >> badges.log

      - name: 📊 Commit Badge Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges.log || true
          git diff --cached --quiet || git commit -m "📊 Update badges [skip ci]"
          git push || true
