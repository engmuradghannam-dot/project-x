version: '3.8'

services:
  # ═══════════════════════════════════════════════════
  # 🔥 Project X API
  # ═══════════════════════════════════════════════════
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    container_name: project-x-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/project_x
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    depends_on:
      - db
      - redis
    networks:
      - project-x-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ═══════════════════════════════════════════════════
  # 🧪 Experiment Runner
  # ═══════════════════════════════════════════════════
  experiment:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: experiment
    container_name: project-x-experiment
    ports:
      - "8888:8888"
    environment:
      - ENVIRONMENT=experiment
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/project_x
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ../experiments:/app/experiments
      - ../notebooks:/app/notebooks
    depends_on:
      - db
      - redis
    networks:
      - project-x-network
    profiles:
      - experiment

  # ═══════════════════════════════════════════════════
  # 🗄️ PostgreSQL Database
  # ═══════════════════════════════════════════════════
  db:
    image: postgres:15-alpine
    container_name: project-x-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=project_x
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - project-x-network
    restart: unless-stopped

  # ═══════════════════════════════════════════════════
  # 🔴 Redis Cache
  # ═══════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: project-x-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - project-x-network
    restart: unless-stopped

  # ═══════════════════════════════════════════════════
  # 📊 Prometheus (Metrics)
  # ═══════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:latest
    container_name: project-x-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - project-x-network
    profiles:
      - monitoring

  # ═══════════════════════════════════════════════════
  # 📈 Grafana (Dashboards)
  # ═══════════════════════════════════════════════════
  grafana:
    image: grafana/grafana:latest
    container_name: project-x-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - project-x-network
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  project-x-network:
    driver: bridge
